<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FlipBook Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101219;color:#f5f5f8;font:15px system-ui}header{padding:15px 22px;border-bottom:1px solid #363a48;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}.layout{display:grid;grid-template-columns:280px minmax(0,1fr) 250px;min-height:calc(100vh - 65px)}aside{background:#1b1e28;padding:20px;border-right:1px solid #343846}aside:last-child{border-right:0;border-left:1px solid #343846}h2{font-size:16px;margin:0 0 20px}button,input,select{font:inherit;border-radius:7px;padding:10px}button{border:1px solid #50566b;background:#303648;color:white;cursor:pointer}button:hover{background:#424a60}button:disabled{opacity:.45}input,select{width:100%;background:#101219;color:white;border:1px solid #565b6b;margin:5px 0 14px}label{display:block;font-size:13px;color:#c7cbd6}.tool{display:block;width:100%;text-align:left;margin:10px 0}.stage{padding:22px;overflow:auto;text-align:center}.page{position:relative;display:inline-block;max-width:100%;box-shadow:0 16px 35px #0009;background:white;line-height:0}.page canvas{max-width:100%;height:auto}.item{position:absolute;line-height:1.2;cursor:move;outline:2px solid transparent;overflow:hidden;display:flex;align-items:center;justify-content:center}.item.selected{outline:3px solid #4f9dff}.item.link{border:2px dashed #438cff;background:#438cff22;color:#003cff}.item.video{background:#121927d9;color:white}.item.text{justify-content:flex-start;text-align:left;white-space:pre-wrap}.pagebar{display:flex;gap:12px;justify-content:center;align-items:center;margin:15px}.muted{color:#aeb5c5;font-size:13px;line-height:1.5}.save{background:#a9c6ff;color:#101219}a{color:#b5caff}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{border:0;border-bottom:1px solid #343846}.stage{order:-1}}
</style></head><body>
<header><h1>FlipBook · Visual Editor</h1><div><a id="view" target="_blank">View flipbook</a> &nbsp; <button id="save" class="save">Save changes</button></div></header>
<div class="layout"><aside><h2>Add to page</h2><button class="tool" data-type="link">+ Clickable link</button><button class="tool" data-type="video">+ Video thumbnail</button><button class="tool" data-type="text">+ Text</button><p class="muted">Select a page, add an element, and drag it into position. This first version adds elements above the PDF; it does not yet move existing PDF text.</p></aside>
<main class="stage"><div id="page" class="page"><canvas id="pdf"></canvas></div><div class="pagebar"><button id="prev">← Previous</button><span id="count">Loading…</span><button id="next">Next →</button></div><p id="message" class="muted"></p></main>
<aside><h2>Element settings</h2><div id="empty" class="muted">Select an element to edit it.</div><div id="fields" hidden><label>Label or text<input id="label"></label><label>Link / video URL<input id="url" placeholder="https://"></label><label>Font<select id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Times New Roman</option><option>Courier New</option></select></label><label>Font size (px)<input id="size" type="number" min="8" max="120"></label><label>Text color<input id="color" type="color"></label><label>Width (% of page)<input id="width" type="range" min="5" max="95"></label><label>Height (% of page)<input id="height" type="range" min="3" max="70"></label><button id="remove">Remove element</button></div></aside></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(async()=>{
const id=location.pathname.split('/').pop(), $=s=>document.getElementById(s);
$('view').href='/b/'+id;
const pdfjs=window.pdfjsLib;pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let elements=[],selected=null,index=1,doc;
try{
const [resp,pdf]=await Promise.all([fetch('/api/elements/'+id),pdfjs.getDocument('/pdf/'+id).promise]);
if(!resp.ok)throw Error('Could not load saved elements');
elements=await resp.json();doc=pdf;await draw();
}catch(e){$('message').textContent=e.message;return}
function current(){return elements.filter(e=>e.page===index)}
function select(e){selected=e;refresh()}
function refresh(){
$('fields').hidden=!selected;$('empty').hidden=!!selected;
if(selected){$('label').value=selected.label||'';$('url').value=selected.url||'';$('font').value=selected.font||'Arial';$('size').value=selected.size||22;$('color').value=selected.color||'#111111';$('width').value=selected.w;$('height').value=selected.h}
document.querySelectorAll('.item').forEach(n=>n.classList.toggle('selected',selected&&n.dataset.id===selected.id));
}
function add(type){const e={id:crypto.randomUUID(),page:index,type,x:15,y:20,w:45,h:type==='text'?12:20,label:type==='video'?'▶ Play video':type==='link'?'Open link':'Your text here',url:'',font:'Arial',size:22,color:'#111111'};elements.push(e);selected=e;paint();refresh()}
document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>add(b.dataset.type));
function paint(){
document.querySelectorAll('.item').forEach(n=>n.remove());
for(const e of current()){
const n=document.createElement('div');n.className='item '+e.type;n.dataset.id=e.id;n.style.left=e.x+'%';n.style.top=e.y+'%';n.style.width=e.w+'%';n.style.height=e.h+'%';n.style.fontFamily=e.font;n.style.fontSize=e.size+'px';n.style.color=e.type==='video'?'white':e.color;n.textContent=e.label;n.title='Drag to reposition';$('page').append(n);
n.onclick=()=>select(e);
n.onpointerdown=ev=>{ev.preventDefault();select(e);n.setPointerCapture(ev.pointerId);const rect=$('page').getBoundingClientRect(),sx=ev.clientX,sy=ev.clientY,ox=e.x,oy=e.y;n.onpointermove=move=>{if(!n.hasPointerCapture(move.pointerId))return;e.x=Math.max(0,Math.min(100-e.w,ox+(move.clientX-sx)/rect.width*100));e.y=Math.max(0,Math.min(100-e.h,oy+(move.clientY-sy)/rect.height*100));n.style.left=e.x+'%';n.style.top=e.y+'%'};n.onpointerup=()=>{n.onpointermove=null}};
}refresh()
}
async function draw(){const p=await doc.getPage(index),v=p.getViewport({scale:1.5}),c=$('pdf');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;$('count').textContent='Page '+index+' of '+doc.numPages;$('prev').disabled=index===1;$('next').disabled=index===doc.numPages;selected=null;paint()}
$('prev').onclick=()=>{if(index>1){index--;draw()}};$('next').onclick=()=>{if(index<doc.numPages){index++;draw()}};
for(const key of ['label','url','font','size','color','width','height'])$(key).oninput=()=>{if(!selected)return;const map={width:'w',height:'h'};selected[map[key]||key]=['size','width','height'].includes(key)?Number($(key).value):$(key).value;paint()};
$('remove').onclick=()=>{elements=elements.filter(e=>e!==selected);selected=null;paint()};
$('save').onclick=async()=>{const b=$('save');b.disabled=true;$('message').textContent='Saving…';try{const r=await fetch('/api/elements/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(elements)});if(!r.ok)throw Error(await r.text());$('message').textContent='Saved. Open the flipbook to see your changes.'}catch(e){$('message').textContent='Save failed: '+e.message}finally{b.disabled=false}};
})();
</script></body></html>
